name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run API tests
        run: mkdir -p reports && pytest -m api --html=reports/api-report.html --self-contained-html

      - name: Run UI tests
        run: pytest -m "not api" --html=reports/ui-report.html --self-contained-html

      - name: Run Postman collection (Newman)
        run: npx --yes newman run postman/jsonplaceholder.postman_collection.json --reporters cli,junit --reporter-junit-export reports/newman.xml

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
