[pytest]
# Look for tests only in the tests/ folder.
testpaths = tests

# Add the project root to sys.path so `from pages.login_page import ...`
# works from inside tests/ without any hacks.
pythonpath = .

# Default flags: verbose, short tracebacks, screenshot saved on failure
# (pytest-playwright writes them to test-results/).
addopts = -v --tb=short --screenshot=only-on-failure

# Markers let us run a subset: `pytest -m smoke`, `pytest -m "not e2e"`.
markers =
    smoke: fast checks that the app is up and basic flows work
    regression: feature-level checks run before every release
    e2e: full user journeys across several pages
